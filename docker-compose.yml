services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${DB_PORT:-5432}:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tennis:tennis@db:5432/tennis
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-thales,ricardo}
      SEED_PLAYERS: ${SEED_PLAYERS:-true}
      TZ_NAME: America/Sao_Paulo
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
